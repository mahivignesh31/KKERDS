<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Full Stack Python">
  <defs>
    <linearGradient id="bg-python-fullstack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3d2e"/>
      <stop offset="100%" stop-color="#1f6b4f"/>
    </linearGradient>
    <filter id="soft-python-fullstack" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="720" height="420" fill="url(#bg-python-fullstack)"/>
  <circle cx="620" cy="-30" r="220" fill="#d7f0e2" fill-opacity=".10"/>
  <circle cx="-20" cy="460" r="180" fill="#d7f0e2" fill-opacity=".08"/>
  <text x="48" y="58" fill="#d7f0e2" font-family="Manrope,Arial,sans-serif" font-size="13" letter-spacing="3.2" font-weight="700">KK LEARNING</text>
  <text x="48" y="92" fill="#ffffffcc" font-family="DM Sans,Arial,sans-serif" font-size="14" letter-spacing="2.4">TECHNOLOGY</text>
  <text x="48" y="148" fill="#f7fbf7" font-family="Manrope,Arial,sans-serif" font-size="40" font-weight="800">Full Stack</text><text x="48" y="196" fill="#f7fbf7" font-family="Manrope,Arial,sans-serif" font-size="40" font-weight="800">Python</text>
  <rect x="48" y="252" width="64" height="5" rx="3" fill="#d7f0e2"/>
  <g transform="translate(370 55)" filter="url(#soft-python-fullstack)">
    <rect width="310" height="310" rx="28" fill="#d7f0e2"/>
    
    <rect x="36" y="40" width="248" height="240" rx="18" fill="#0f3d2e" fill-opacity=".06"/>
    <text x="58" y="95" fill="#0f3d2e" font-family="ui-monospace,Menlo,monospace" font-size="22" opacity=".9">def learn():</text>
    <text x="78" y="135" fill="#0f3d2e" font-family="ui-monospace,Menlo,monospace" font-size="20" opacity=".75">build()</text>
    <text x="78" y="175" fill="#0f3d2e" font-family="ui-monospace,Menlo,monospace" font-size="20" opacity=".75">practice()</text>
    <text x="78" y="215" fill="#0f3d2e" font-family="ui-monospace,Menlo,monospace" font-size="20" opacity=".75">grow()</text>
    <text x="58" y="255" fill="#0f3d2e" font-family="ui-monospace,Menlo,monospace" font-size="22" opacity=".9">return skill</text>
  </g>
</svg>